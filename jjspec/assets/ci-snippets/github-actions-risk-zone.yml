# GitHub Actions：风险区门禁 job（追加到现有 ci.yml 的 jobs: 下）
# 依赖：AGENTS.md 第 5 节风险区清单含 risk-zones-begin/end 标记（单一事实源，禁止另建清单文件）。
# 机制：触碰风险区的 commit 必须带 [risk-ok: @<批准人>] 标记（人批准留痕），无标记即失败（fail-closed）。
#       脚本校验四项：标记存在 / 填了批准人（裸 [risk-ok] 无效）/ 非占位符 / 与 author 不同名（同名检查）。
#       ⚠️ 后两项只是字符串比对，不等同平台账号校验；脚本不能证明批准属实（名字可伪造）——
#         真实凭据靠平台 required approvals / CI 调平台 API，脚本是补充不是替代。
#       ⚠️ 双父合并使用自动合并重放及冲突路径检查，需 git >= 2.38；能力不足或执行出错即失败。
jobs:
  risk-zone-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以遍历基准分支以来的全部 commit
      - name: 风险区门禁（[risk-ok: @批准人] 唯一合法门）
        run: |
          chmod +x .github/scripts/risk-zone-check.sh
          .github/scripts/risk-zone-check.sh origin/${{ github.base_ref }} AGENTS.md
